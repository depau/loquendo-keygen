[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loqkeygen"
version = "1.0.0"
description = "Keygen for the abandoned Loquendo TTS 7 'UNIFIED Licensing SW' (historical preservation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "loquendo-keygen contributors" }]
keywords = ["loquendo", "tts", "keygen", "reverse-engineering", "abandonware"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]

[project.scripts]
loqkeygen = "loqkeygen.cli:main"

[project.urls]
"Research notes" = "https://github.com/depau/loquendo-keygen/blob/main/RESEARCH.md"

[tool.hatch.build.targets.wheel]
packages = ["src/loqkeygen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
